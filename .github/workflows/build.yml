name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only checks out and builds/lints code.
permissions:
  contents: read

jobs:
  build-producer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Build producer
        run: mvn -f producer/pom.xml clean package -q

  build-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Build consumer
        run: mvn -f consumer/pom.xml clean package -q

  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cfn-lint
        run: pip install cfn-lint
      - name: Lint CloudFormation templates
        run: cfn-lint cloudformation/*.yaml
